# Local-first is primary. Weekly GitHub backup for active ecosystems only.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /examples/android
    schedule:
      interval: weekly
    groups:
      android-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        versions: [">=2.3.30"]
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [">=2.3.30"]
